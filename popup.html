<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Ad Block</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <img src="icons/youtube-48.png" width="32" height="32" alt="">
    <h1>YouTube Ad Block</h1>
  </header>
  <main>
    <label class="setting">
      <span><strong>Auto Skip</strong><small>Clicks the Skip ad button when it appears.</small></span>
      <input id="auto-skip" type="checkbox" role="switch" aria-label="Auto Skip" disabled>
    </label>
    <label class="setting">
      <span><strong>Ad Blocking</strong><small>Block YouTube ads.</small></span>
      <input id="ad-blocking" type="checkbox" role="switch" aria-label="Ad Blocking" disabled>
    </label>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
